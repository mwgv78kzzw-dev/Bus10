<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Buss 10">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a22" media="(prefers-color-scheme: dark)">
<title>Buss 10 · Strandlien</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef2f4;
    --panel: #ffffff;
    --ink: #14232f;
    --muted: #586a76;
    --line: #d5dde2;
    --red: #d0202b;
    --late: #a84a08;
    --ok: #1a7548;
    --sun: #f5a300;
    --moon: #7b93ad;
    --cloud: #b4c3cf;
    --cloud-dark: #8b9fb0;
    --rain: #2f7fc4;
    --snow: #6db0e8;
    --bolt: #f2b200;
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
    --text: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a22;
      --panel: #16252f;
      --ink: #eaf1f5;
      --muted: #93a5b1;
      --line: #29404e;
      --red: #ff5a5f;
      --late: #f0a35e;
      --ok: #55c58a;
      --sun: #ffc247;
      --moon: #e6eef5;
      --cloud: #b9c7d3;
      --cloud-dark: #7e92a2;
      --rain: #6cb7ff;
      --snow: #e8f3ff;
      --bolt: #ffd44d;
    }
  }
  * { box-sizing: border-box; }

  /* Everything is sized in rem, and the root size follows the screen,
     so the layout scales to fit any phone, tablet or desktop window. */
  html {
    font-size: clamp(11px, min(2vh, 4.2vw), 28px);
    font-size: clamp(11px, min(2dvh, 4.2vw), 28px);
    -webkit-text-size-adjust: 100%;
  }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--text);
    font-weight: 500;
    font-size: max(14px, 1rem);
    line-height: 1.3;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding:
      calc(env(safe-area-inset-top, 0px) + 0.9rem)
      calc(env(safe-area-inset-right, 0px) + 0.9rem)
      calc(env(safe-area-inset-bottom, 0px) + 0.9rem)
      calc(env(safe-area-inset-left, 0px) + 0.9rem);
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  header { display: flex; align-items: center; gap: 0.9rem; flex: none; }
  .badge {
    flex: none; min-width: 3.1rem; height: 3.1rem; padding: 0 0.5rem;
    border-radius: 0.6rem; background: var(--red); color: #fff;
    font: 700 2rem/3.1rem var(--display); text-align: center;
  }
  h1 { margin: 0; font: 600 1.7rem/1.1 var(--text); }
  .sub { color: var(--muted); font-size: max(12px, 0.9rem); }
  .weather {
    margin-left: auto; flex: none;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; line-height: 1; min-width: 3.6rem;
  }
  .weather[hidden] { display: none; }
  .w-icon { width: 3.6rem; height: 3.6rem; }
  .w-icon svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* Animated weather icons */
  .w-svg .w-sun { fill: var(--sun); transform-box: fill-box; transform-origin: center; animation: w-pulse 3.5s ease-in-out infinite; }
  .w-svg .w-rays { stroke: var(--sun); stroke-width: 3; stroke-linecap: round; animation: w-spin 26s linear infinite; }
  .w-svg .w-moon, .w-svg .w-star { fill: var(--moon); }
  .w-svg .w-moon { animation: w-bob 6s ease-in-out infinite alternate; }
  .w-svg .w-star { animation: w-twinkle 2.6s ease-in-out infinite; }
  .w-svg .w-cloud { fill: var(--cloud); stroke: var(--bg); stroke-width: 2; paint-order: stroke; }
  .w-svg .w-cloud.dark { fill: var(--cloud-dark); }
  .w-svg .w-drift { animation: w-drift 7s ease-in-out infinite alternate; }
  .w-svg .w-drift.rev { animation-duration: 9s; animation-direction: alternate-reverse; }
  .w-svg .w-drop { stroke: var(--rain); stroke-width: 2.6; stroke-linecap: round; animation: w-fall 1.1s linear infinite backwards; }
  .w-svg .w-flake { fill: var(--snow); animation: w-snow 2.8s linear infinite backwards; }
  .w-svg .w-bolt { fill: var(--bolt); stroke: var(--bg); stroke-width: 1.2; stroke-linejoin: round; animation: w-flash 3.4s linear infinite; }
  .w-svg .w-fog { stroke: var(--cloud-dark); stroke-width: 3.2; stroke-linecap: round; animation: w-mist 5s ease-in-out infinite alternate; }
  @keyframes w-spin { to { transform: rotate(360deg); } }
  @keyframes w-pulse { 50% { transform: scale(1.07); } }
  @keyframes w-bob { to { transform: translateY(-1.5px); } }
  @keyframes w-twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @keyframes w-drift { from { transform: translateX(-2px); } to { transform: translateX(2px); } }
  @keyframes w-fall { 0% { transform: translateY(-3px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(8px); opacity: 0; } }
  @keyframes w-snow { 0% { transform: translate(0, -3px); opacity: 0; } 15% { opacity: 1; } 50% { transform: translate(2px, 3px); } 100% { transform: translate(-1px, 10px); opacity: 0; } }
  @keyframes w-flash { 0%, 50%, 100% { opacity: 0.45; } 52% { opacity: 1; } 55% { opacity: 0.5; } 57% { opacity: 1; } 63% { opacity: 0.45; } }
  @keyframes w-mist { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
  @media (prefers-reduced-motion: reduce) {
    .w-svg * { animation: none !important; }
  }
  .w-temp { margin-top: -0.5rem; font: 700 1.5rem/1 var(--display); font-variant-numeric: tabular-nums; }

  #updated { flex: none; margin: 0.7rem 0.1rem 0; color: var(--muted); font-size: max(12px, 0.85rem); min-height: 1.3em; }

  /* Directions fill the space that's left: stacked in portrait, side by side in landscape. */
  #dirs {
    flex: 1 1 auto;
    display: flex; flex-direction: column; gap: 0.9rem;
    margin-top: 0.9rem;
  }
  @media (orientation: landscape) {
    #dirs { flex-direction: row; }
  }
  .dir {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 1rem; padding: 1rem 1.2rem 0.3rem;
  }
  .dir h2 { margin: 0 0 0.3rem; font-size: max(12px, 0.9rem); font-weight: 500; color: var(--muted); }
  .dir h2 .place {
    display: block; margin-top: 0.1rem;
    font: 600 1.5rem/1.15 var(--text); color: var(--ink);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden; overflow-wrap: anywhere;
  }

  .deps { flex: 1; display: flex; flex-direction: column; list-style: none; margin: 0; padding: 0; }
  .dep {
    flex: 1 1 0; padding: 0.35rem 0;
    display: grid; grid-template-columns: 8.2rem 1fr;
    align-items: center; gap: 0.6rem;
    border-top: 1px solid var(--line);
  }
  .dep:first-child { border-top: 0; }
  .dep.first { flex: 2 1 0; }
  .when { white-space: nowrap; }
  .num { font: 700 2.4rem/1 var(--display); font-variant-numeric: tabular-nums; }
  .unit { font-family: var(--text); font-weight: 600; font-size: max(14px, 1.1rem); color: var(--muted); margin-left: 0.25rem; }
  .dep.first .num { font-size: 4.6rem; }
  .dep.first .num.clock { font-size: 2.5rem; }
  .dep.first .num.word { font-size: 3.4rem; }
  .dep.soon .num { color: var(--red); }
  .dest { font-weight: 600; font-size: max(14px, 1.05rem); }
  .status { color: var(--muted); font-size: max(13px, 1rem); font-weight: 600; }
  .dest + .status { font-size: max(12px, 0.9rem); font-weight: 500; }
  .status.late { color: var(--late); }
  .status.live { color: var(--ok); }

  .msg {
    flex: none; margin-top: 0.9rem; padding: 0.8rem 1rem; border-radius: 0.8rem;
    background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--red);
    font-size: max(14px, 1rem);
  }
  .msg p { margin: 0 0 0.2rem; }
  .msg p:last-child { margin: 0; color: var(--muted); font-size: max(12px, 0.9rem); }
  /* Nyhetsticker */
  .ticker {
    flex: none; display: flex; align-items: center; gap: 0.7rem;
    margin-top: 0.7rem; padding: 0.5rem 0.8rem 0.5rem 0.55rem;
    background: var(--panel); border: 1px solid var(--line); border-radius: 1rem;
  }
  .ticker[hidden] { display: none; }
  .tk-label {
    flex: none; padding: 0.3rem 0.55rem; border-radius: 0.5rem;
    background: var(--ink); color: var(--bg);
    font-family: var(--display); font-weight: 700; font-size: max(12px, 0.9rem); line-height: 1; letter-spacing: 0.08em;
  }
  .tk-view {
    flex: 1; min-width: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
  }
  .tk-track { display: inline-flex; white-space: nowrap; will-change: transform; animation: tk-scroll 120s linear infinite; }
  .ticker:active .tk-track { animation-play-state: paused; }
  @keyframes tk-scroll { to { transform: translateX(-50%); } }
  .tk-set { display: inline-flex; align-items: baseline; }
  .tk-item { font-size: max(14px, 1rem); }
  .tk-item b { font-weight: 600; }
  .tk-in { margin-left: 0.45em; color: var(--muted); }
  .tk-dot { margin: 0 1.1rem; color: var(--red); }
  .tk-track.single { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; white-space: normal; animation: none; }
  @media (prefers-reduced-motion: reduce) { .tk-track { animation: none; } }

  footer { flex: none; margin: 0.5rem 0.1rem 0; color: var(--muted); font-size: max(11px, 0.75rem); }
</style>
</head>
<body>
<main>
  <header>
    <div class="badge" aria-label="Linje 10">10</div>
    <div>
      <h1>Strandlien</h1>
      <div class="sub">Skyss · Bergen</div>
    </div>
    <div class="weather" id="weather" hidden>
      <div class="w-icon" id="w-icon" aria-hidden="true"></div>
      <span class="w-temp" id="w-temp"></span>
    </div>
  </header>

  <div id="updated" role="status" aria-live="polite">Laster avganger…</div>
  <div id="dirs"></div>
  <div id="msg"></div>

  <div class="ticker" id="ticker" role="region" aria-label="Nyheter fra NRK" hidden>
    <span class="tk-label">NRK</span>
    <div class="tk-view"><div class="tk-track" id="tk-track"></div></div>
  </div>

  <footer>Data fra Entur, Meteorologisk institutt og NRK.</footer>
</main>

<script>
(function () {
  "use strict";

  var CLIENT = "personal-strandlien-bus10";
  var GRAPHQL = "https://api.entur.io/journey-planner/v3/graphql";
  var GEOCODER = "https://api.entur.io/geocoder/v1/autocomplete";
  var LINE = "10";
  var STOP_NAME = "Strandlien";
  var SHOW = 3;

  var QUERY =
    "query Departures($id: String!) {" +
    "  stopPlace(id: $id) {" +
    "    id name latitude longitude" +
    "    estimatedCalls(numberOfDepartures: 150, timeRange: 43200) {" +
    "      realtime aimedDepartureTime expectedDepartureTime" +
    "      destinationDisplay { frontText }" +
    "      quay { id publicCode }" +
    "      serviceJourney { line { publicCode } }" +
    "    }" +
    "  }" +
    "}";

  var timeFmt = new Intl.DateTimeFormat("en-GB", {
    hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "Europe/Oslo"
  });

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  var state = { calls: [], updatedAt: null, error: null, loaded: false, lat: null, lon: null };
  var weather = { at: 0, busy: false };
  var busy = false;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function getJSON(url, opts) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 12000);
    opts = opts || {};
    opts.signal = ctl.signal;
    return fetch(url, opts).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).finally(function () { clearTimeout(timer); });
  }

  function fetchCalls(id) {
    return getJSON(GRAPHQL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "ET-Client-Name": CLIENT },
      body: JSON.stringify({ query: QUERY, variables: { id: id } })
    }).then(function (j) {
      if (j.errors && j.errors.length) throw new Error(j.errors[0].message);
      var sp = j.data && j.data.stopPlace;
      if (!sp) return { calls: [], lat: null, lon: null };
      var calls = (sp.estimatedCalls || []).filter(function (c) {
        var l = c.serviceJourney && c.serviceJourney.line;
        return l && l.publicCode === LINE;
      });
      return { calls: calls, lat: sp.latitude, lon: sp.longitude };
    });
  }

  // Finds the Bergen-area stop called Strandlien that line 10 actually serves.
  function findStop() {
    var url = GEOCODER + "?text=" + encodeURIComponent(STOP_NAME) + "&layers=venue&size=15&lang=no";
    return getJSON(url, { headers: { "ET-Client-Name": CLIENT } }).then(function (j) {
      var feats = (j.features || []).filter(function (f) {
        return f.properties && String(f.properties.id).indexOf("NSR:StopPlace:") === 0;
      });
      var exact = feats.filter(function (f) {
        return String(f.properties.name || "").toLowerCase() === STOP_NAME.toLowerCase();
      });
      if (exact.length) feats = exact;
      var local = feats.filter(function (f) {
        return /vestland|hordaland/i.test(String(f.properties.county || ""));
      });
      if (local.length) feats = local;
      if (!feats.length) throw new Error("Fant ikke et stopp som heter " + STOP_NAME + ".");

      var ids = feats.slice(0, 6).map(function (f) { return f.properties.id; });
      var i = 0;
      function next() {
        if (i >= ids.length) return Promise.resolve({ id: null, calls: [], lat: null, lon: null });
        var id = ids[i++];
        return fetchCalls(id).then(function (res) {
          return res.calls.length ? { id: id, calls: res.calls, lat: res.lat, lon: res.lon } : next();
        });
      }
      return next();
    });
  }

  function load() {
    if (busy) return;
    busy = true;
    var id = store.get("stopId");
    var p = id
      ? fetchCalls(id).then(function (res) { return { id: id, calls: res.calls, lat: res.lat, lon: res.lon }; })
      : findStop().then(function (res) { if (res.id) store.set("stopId", res.id); return res; });

    p.then(function (res) {
      state.calls = res.calls;
      if (typeof res.lat === "number" && typeof res.lon === "number") { state.lat = res.lat; state.lon = res.lon; }
      loadWeather();
      state.updatedAt = new Date();
      state.error = null;
      state.loaded = true;
    }).catch(function (err) {
      state.error = err && err.name === "AbortError" ? "Forespørselen tok for lang tid." : (err && err.message) || "Ukjent feil.";
    }).finally(function () {
      busy = false;
      render();
    });
  }


  // Weather from MET Norway (Yr). Uses the stop's own coordinates, Bergen centre as fallback.
  var CLOUD_D = "M18 44h26a9 9 0 0 0 1.5-17.9A13 13 0 0 0 20.6 22.5 11 11 0 0 0 18 44z";
  var MOON_D = "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z";

  function gCloud(tx, ty, k, o) {
    o = o || {};
    return '<g transform="translate(' + tx + ' ' + ty + ') scale(' + k + ')"><g class="w-drift' + (o.rev ? " rev" : "") + '">' +
      '<path class="w-cloud' + (o.dark ? " dark" : "") + '" d="' + CLOUD_D + '"/></g></g>';
  }
  function gSun(cx, cy, r) {
    var rays = "";
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
      rays += '<line x1="' + (cx + c * (r + 4)).toFixed(1) + '" y1="' + (cy + s * (r + 4)).toFixed(1) +
              '" x2="' + (cx + c * (r + 8)).toFixed(1) + '" y2="' + (cy + s * (r + 8)).toFixed(1) + '"/>';
    }
    return '<g class="w-rays" style="transform-origin:' + cx + 'px ' + cy + 'px">' + rays + '</g>' +
           '<circle class="w-sun" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>';
  }
  function gMoon(x, y, k) {
    return '<g transform="translate(' + x + ' ' + y + ') scale(' + k + ')"><path class="w-moon" d="' + MOON_D + '"/></g>';
  }
  function gStars(list) {
    return list.map(function (p) {
      return '<circle class="w-star" cx="' + p[0] + '" cy="' + p[1] + '" r="' + p[2] + '" style="animation-delay:' + p[3] + 's"/>';
    }).join("");
  }
  function gDrops(xs, y0) {
    return xs.map(function (x, i) {
      return '<line class="w-drop" x1="' + x + '" y1="' + y0 + '" x2="' + (x - 2) + '" y2="' + (y0 + 6) + '" style="animation-delay:' + (i * 0.28).toFixed(2) + 's"/>';
    }).join("");
  }
  function gFlakes(xs, y0) {
    return xs.map(function (x, i) {
      return '<circle class="w-flake" cx="' + x + '" cy="' + y0 + '" r="1.9" style="animation-delay:' + (i * 0.55).toFixed(2) + 's"/>';
    }).join("");
  }
  function gFog(cy, x1, x2, delay) {
    return '<line class="w-fog" x1="' + x1 + '" y1="' + cy + '" x2="' + x2 + '" y2="' + cy + '" style="animation-delay:' + delay + 's"/>';
  }

  function weatherSvg(code) {
    var night = /_night$/.test(code);
    var base = code.replace(/_(day|night|polartwilight)$/, "");
    var thunder = base.indexOf("thunder") !== -1;
    var sleet = base.indexOf("sleet") !== -1;
    var snow = base.indexOf("snow") !== -1;
    var rain = base.indexOf("rain") !== -1;
    var showers = base.indexOf("showers") !== -1;
    var heavy = base.indexOf("heavy") === 0;
    var light = base.indexOf("light") === 0;
    var body;

    if (thunder || sleet || snow || rain) {
      var xs = thunder ? [19, 47] : light ? [26, 40] : heavy ? [20, 28, 36, 44] : [22, 32, 42];
      var peek = showers && !thunder;
      var y0 = peek ? 51 : 42;
      var precip;
      if (sleet) {
        precip = gDrops(xs.filter(function (_, i) { return i % 2 === 0; }), y0) +
                 gFlakes(xs.filter(function (_, i) { return i % 2 === 1; }), y0);
      } else if (snow) {
        precip = gFlakes(xs, y0);
      } else {
        precip = gDrops(xs, y0);
      }
      if (thunder) precip += '<polygon class="w-bolt" points="35,34 26,50 33,50 29,62 42,44 35,44 39,34"/>';
      body = peek
        ? (night ? gMoon(3, 1, 1.5) : gSun(22, 22, 8)) + gCloud(14, 12, 0.85) + precip
        : gCloud(0, -5, 1, { dark: true }) + precip;
    } else if (base === "fog") {
      body = gCloud(0, -4, 0.95) + gFog(44, 14, 50, 0) + gFog(50, 20, 56, -1.2) + gFog(56, 12, 44, -2.4);
    } else if (base === "clearsky") {
      body = night
        ? gMoon(9, 11, 1.9) + gStars([[47, 17, 1.6, 0], [53, 29, 1.2, 0.9], [40, 10, 1.1, 1.6]])
        : gSun(32, 32, 11);
    } else if (base === "fair") {
      body = (night ? gMoon(6, 6, 1.6) : gSun(26, 26, 10)) + gCloud(27, 25, 0.55);
    } else if (base === "partlycloudy") {
      body = (night ? gMoon(3, 1, 1.5) : gSun(22, 22, 8)) + gCloud(14, 12, 0.85);
    } else {
      body = gCloud(18, 3, 0.8, { dark: true, rev: true }) + gCloud(-2, 10, 0.95);
    }
    return '<svg class="w-svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false">' + body + '</svg>';
  }

  function loadWeather() {
    if (weather.busy || Date.now() - weather.at < 10 * 60 * 1000) return;
    weather.busy = true;
    var lat = typeof state.lat === "number" ? state.lat : 60.39;
    var lon = typeof state.lon === "number" ? state.lon : 5.32;
    var url = "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=" + lat.toFixed(4) + "&lon=" + lon.toFixed(4);
    getJSON(url).then(function (j) {
      var now = j.properties.timeseries[0].data;
      var t = now.instant.details.air_temperature;
      var next = now.next_1_hours || now.next_6_hours || now.next_12_hours;
      var code = next && next.summary && next.summary.symbol_code;
      if (typeof t !== "number" || !code) throw new Error("no weather");
      var deg = Math.round(t);
      $("w-icon").innerHTML = weatherSvg(code);
      $("w-temp").textContent = deg + "°";
      $("weather").setAttribute("aria-label", "Været nå: " + deg + " grader");
      $("weather").hidden = false;
      weather.at = Date.now();
    }).catch(function () {
      /* keep the last shown weather, or none */
    }).finally(function () { weather.busy = false; });
  }

  // ---- Nyheter fra NRK (overskrift + ingress) ----
  var FEED_URL = "https://www.nrk.no/toppsaker.rss";
  var news = { items: [], sig: "", at: 0, busy: false, idx: 0, timer: null };
  var reduceMotion = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;

  function decodeText(s) {
    var ta = document.createElement("textarea");
    ta.innerHTML = String(s || "").replace(/<\/(p|div|li|h\d)>|<br\s*\/?>/gi, " ").replace(/<[^>]*>/g, "");
    return ta.value.replace(/\s+/g, " ").trim();
  }
  function cleanItems(list) {
    return (Array.isArray(list) ? list : []).filter(function (x) { return x && x.tittel; }).slice(0, 12).map(function (x) {
      return { tittel: String(x.tittel), ingress: String(x.ingress || "") };
    });
  }
  function childText(node, tag) {
    var n = node.getElementsByTagName(tag)[0];
    return n ? n.textContent : "";
  }
  function parseRss(text) {
    var doc = new DOMParser().parseFromString(text, "text/xml");
    if (doc.getElementsByTagName("parsererror").length) throw new Error("Ugyldig RSS");
    var nodes = doc.getElementsByTagName("item"), out = [];
    for (var i = 0; i < nodes.length && out.length < 12; i++) {
      var t = decodeText(childText(nodes[i], "title"));
      if (t) out.push({ tittel: t, ingress: decodeText(childText(nodes[i], "description")) });
    }
    return out;
  }
  function itemsFromJson(text) {
    var j = JSON.parse(text);
    var age = Date.now() - Date.parse(j && j.hentet);
    if (isFinite(age) && age > 3 * 86400000) throw new Error("Gamle nyheter");
    return cleanItems(j && j.saker);
  }
  function itemsFromRss2json(text) {
    var j = JSON.parse(text);
    if (!j || j.status !== "ok") throw new Error("rss2json feilet");
    return cleanItems((j.items || []).map(function (x) {
      return { tittel: decodeText(x.title), ingress: decodeText(x.description) };
    }));
  }
  function getText(url) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 10000);
    return fetch(url, { signal: ctl.signal }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).finally(function () { clearTimeout(timer); });
  }
  // Prøver kildene i rekkefølge til en gir nyheter.
  function newsSources() {
    var list = [];
    var bucket = Math.floor(Date.now() / 300000);
    var m = /^([^.]+)\.github\.io$/.exec(location.hostname);
    var repo = location.pathname.split("/")[1];
    if (m && repo && repo.indexOf(".") === -1) {
      list.push(function () {
        return getText("https://raw.githubusercontent.com/" + m[1] + "/" + repo + "/main/nyheter.json?t=" + bucket).then(itemsFromJson);
      });
    }
    list.push(function () { return getText("nyheter.json?t=" + bucket).then(itemsFromJson); });
    list.push(function () { return getText(FEED_URL).then(parseRss); });
    list.push(function () {
      return getText("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(FEED_URL)).then(itemsFromRss2json);
    });
    return list;
  }
  function fetchNews() {
    var list = newsSources(), i = 0;
    function next() {
      if (i >= list.length) return Promise.reject(new Error("Ingen nyhetskilde svarte"));
      return list[i++]().then(function (items) {
        if (!items.length) throw new Error("Tom");
        return items;
      }).catch(next);
    }
    return next();
  }

  function tickerItem(it) {
    var item = el("span", "tk-item");
    item.appendChild(el("b", null, it.tittel));
    if (it.ingress) item.appendChild(el("span", "tk-in", it.ingress));
    return item;
  }
  function tickerSet(hidden) {
    var set = el("span", "tk-set");
    if (hidden) set.setAttribute("aria-hidden", "true");
    news.items.forEach(function (it) {
      set.appendChild(tickerItem(it));
      set.appendChild(el("span", "tk-dot", "•"));
    });
    return set;
  }
  function showSingle() {
    var track = $("tk-track");
    track.className = "tk-track single";
    track.replaceChildren(tickerItem(news.items[news.idx % news.items.length]));
  }
  function renderTicker() {
    var box = $("ticker"), track = $("tk-track");
    clearInterval(news.timer);
    news.timer = null;
    track.className = "tk-track";
    track.style.animationDuration = "";
    track.replaceChildren();
    if (!news.items.length) { box.hidden = true; return; }
    box.hidden = false;
    if (reduceMotion && reduceMotion.matches) {
      // Uten bevegelse: én sak om gangen, byttes hvert 9. sekund.
      showSingle();
      news.timer = setInterval(function () { news.idx++; showSingle(); }, 9000);
      return;
    }
    track.appendChild(tickerSet(false));
    track.appendChild(tickerSet(true));
    var half = track.getBoundingClientRect().width / 2;
    track.style.animationDuration = Math.max(30, half / 55) + "s";
  }
  function loadNews() {
    if (news.busy || Date.now() - news.at < 8 * 60000) return;
    news.busy = true;
    fetchNews().then(function (items) {
      news.at = Date.now();
      var sig = JSON.stringify(items);
      if (sig !== news.sig) { news.sig = sig; news.items = items; news.idx = 0; renderTicker(); }
    }).catch(function () {
      news.at = Date.now() - 5 * 60000; // prøv igjen om noen minutter
    }).finally(function () { news.busy = false; });
  }

  function whenParts(t, now) {
    var mins = Math.floor((t - now) / 60000);
    if (mins < 1) return { num: "Nå", unit: "", clock: false, word: true, soon: true };
    if (mins < 60) return { num: String(mins), unit: "min", clock: false, soon: mins <= 2 };
    return { num: timeFmt.format(new Date(t)), unit: "", clock: true, soon: false };
  }

  function statusLine(c, t) {
    var aimed = Date.parse(c.aimedDepartureTime);
    var diff = Math.round((t - aimed) / 60000);
    var clock = timeFmt.format(new Date(t));
    if (!c.realtime) return { text: clock + " · Rutetid", cls: "" };
    if (diff >= 1) return { text: clock + " · " + diff + " min forsinket", cls: "late" };
    if (diff <= -1) return { text: clock + " · " + Math.abs(diff) + " min tidlig", cls: "live" };
    return { text: clock + " · I rute", cls: "live" };
  }

  function render() {
    var now = Date.now();
    var dirs = $("dirs");
    var msg = $("msg");
    dirs.replaceChildren();
    msg.replaceChildren();

    var groups = {};
    state.calls.forEach(function (c) {
      var t = Date.parse(c.expectedDepartureTime);
      if (isNaN(t) || t < now - 30000) return;
      var key = (c.quay && c.quay.id) || "unknown";
      (groups[key] = groups[key] || []).push({ call: c, t: t });
    });

    var keys = Object.keys(groups).sort();
    keys.forEach(function (key) {
      var list = groups[key].sort(function (a, b) { return a.t - b.t; }).slice(0, SHOW);
      var firstDest = (list[0].call.destinationDisplay && list[0].call.destinationDisplay.frontText) || "Ukjent";

      var sec = el("section", "dir");
      var h = el("h2", null, "Mot");
      h.appendChild(el("span", "place", firstDest));
      sec.appendChild(h);

      var ol = el("ol", "deps");
      list.forEach(function (d, i) {
        var w = whenParts(d.t, now);
        var s = statusLine(d.call, d.t);
        var dest = (d.call.destinationDisplay && d.call.destinationDisplay.frontText) || firstDest;

        var li = el("li", "dep" + (i === 0 ? " first" : "") + (w.soon ? " soon" : ""));
        var when = el("div", "when");
        when.appendChild(el("span", "num" + (w.clock ? " clock" : "") + (w.word ? " word" : ""), w.num));
        if (w.unit) when.appendChild(el("span", "unit", w.unit));
        var meta = el("div", "meta");
        if (dest !== firstDest) meta.appendChild(el("div", "dest", dest));
        meta.appendChild(el("div", "status " + s.cls, s.text));
        li.appendChild(when);
        li.appendChild(meta);
        ol.appendChild(li);
      });
      sec.appendChild(ol);
      dirs.appendChild(sec);
    });

    var upd = $("updated");
    if (state.updatedAt) {
      upd.textContent = "Oppdatert " + timeFmt.format(state.updatedAt);
    } else if (!state.error) {
      upd.textContent = "Laster avganger…";
    } else {
      upd.textContent = "";
    }

    if (state.error) {
      var box = el("div", "msg");
      box.appendChild(el("p", null, "Kunne ikke laste avganger."));
      box.appendChild(el("p", null, state.error + (state.loaded ? " Viser siste oppdatering." : " Sjekk tilkoblingen og last siden på nytt.")));
      msg.appendChild(box);
    } else if (state.loaded && !keys.length) {
      var empty = el("div", "msg");
      empty.appendChild(el("p", null, "Ingen avganger på linje 10 de neste 12 timene."));
      empty.appendChild(el("p", null, "Sjekk at linjen går i dag."));
      msg.appendChild(empty);
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { load(); loadNews(); }
  });
  setInterval(function () { if (document.visibilityState === "visible") load(); }, 30000);
  setInterval(render, 10000);
  setInterval(loadNews, 60000);

  load();
  loadNews();
})();
</script>
</body>
</html>
