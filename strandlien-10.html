<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Buss 10">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a22" media="(prefers-color-scheme: dark)">
<title>Buss 10 · Strandlien</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef2f4;
    --panel: #ffffff;
    --ink: #14232f;
    --muted: #586a76;
    --line: #d5dde2;
    --red: #d0202b;
    --late: #a84a08;
    --ok: #1a7548;
    --ok-bg: #dcf1e6;
    --go-bg: #eef4f8;
    --warn-bg: #fff3d9;
    --on-red: #ffffff;
    --sun: #f5a300;
    --moon: #7b93ad;
    --cloud: #b4c3cf;
    --cloud-dark: #8b9fb0;
    --rain: #2f7fc4;
    --snow: #6db0e8;
    --bolt: #f2b200;
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
    --text: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a22;
      --panel: #16252f;
      --ink: #eaf1f5;
      --muted: #93a5b1;
      --line: #29404e;
      --red: #ff5a5f;
      --late: #f0a35e;
      --ok: #55c58a;
      --ok-bg: #1d3b2d;
      --go-bg: #1d3140;
      --warn-bg: #3a2b12;
      --on-red: #1a0508;
      --sun: #ffc247;
      --moon: #e6eef5;
      --cloud: #b9c7d3;
      --cloud-dark: #7e92a2;
      --rain: #6cb7ff;
      --snow: #e8f3ff;
      --bolt: #ffd44d;
    }
  }
  * { box-sizing: border-box; }

  /* Everything is sized in rem, and the root size follows the screen,
     so the layout scales to fit any phone, tablet or desktop window. */
  html {
    font-size: clamp(11px, min(2vh, 4.2vw), 28px);
    font-size: clamp(11px, min(2dvh, 4.2vw), 28px);
    -webkit-text-size-adjust: 100%;
  }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--text);
    font-weight: 500;
    font-size: max(14px, 1rem);
    line-height: 1.3;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding:
      calc(env(safe-area-inset-top, 0px) + 0.9rem)
      calc(env(safe-area-inset-right, 0px) + 0.9rem)
      calc(env(safe-area-inset-bottom, 0px) + 0.9rem)
      calc(env(safe-area-inset-left, 0px) + 0.9rem);
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  header { display: flex; align-items: center; gap: 0.9rem; flex: none; }
  .badge {
    flex: none; min-width: 3.1rem; height: 3.1rem; padding: 0 0.5rem;
    border-radius: 0.6rem; background: var(--red); color: #fff;
    font: 700 2rem/3.1rem var(--display); text-align: center;
  }
  h1 { margin: 0; font: 600 1.7rem/1.1 var(--text); }
  .sub { color: var(--muted); font-size: max(12px, 0.9rem); }
  .weather {
    margin-left: auto; flex: none;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; line-height: 1; min-width: 3.6rem;
  }
  .weather[hidden] { display: none; }
  .w-icon { width: 3.6rem; height: 3.6rem; }
  .w-icon svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* Animated weather icons */
  .w-svg .w-sun { fill: var(--sun); transform-box: fill-box; transform-origin: center; animation: w-pulse 3.5s ease-in-out infinite; }
  .w-svg .w-rays { stroke: var(--sun); stroke-width: 3; stroke-linecap: round; animation: w-spin 26s linear infinite; }
  .w-svg .w-moon, .w-svg .w-star { fill: var(--moon); }
  .w-svg .w-moon { animation: w-bob 6s ease-in-out infinite alternate; }
  .w-svg .w-star { animation: w-twinkle 2.6s ease-in-out infinite; }
  .w-svg .w-cloud { fill: var(--cloud); stroke: var(--bg); stroke-width: 2; paint-order: stroke; }
  .w-svg .w-cloud.dark { fill: var(--cloud-dark); }
  .w-svg .w-drift { animation: w-drift 7s ease-in-out infinite alternate; }
  .w-svg .w-drift.rev { animation-duration: 9s; animation-direction: alternate-reverse; }
  .w-svg .w-drop { stroke: var(--rain); stroke-width: 2.6; stroke-linecap: round; animation: w-fall 1.1s linear infinite backwards; }
  .w-svg .w-flake { fill: var(--snow); animation: w-snow 2.8s linear infinite backwards; }
  .w-svg .w-bolt { fill: var(--bolt); stroke: var(--bg); stroke-width: 1.2; stroke-linejoin: round; animation: w-flash 3.4s linear infinite; }
  .w-svg .w-fog { stroke: var(--cloud-dark); stroke-width: 3.2; stroke-linecap: round; animation: w-mist 5s ease-in-out infinite alternate; }
  @keyframes w-spin { to { transform: rotate(360deg); } }
  @keyframes w-pulse { 50% { transform: scale(1.07); } }
  @keyframes w-bob { to { transform: translateY(-1.5px); } }
  @keyframes w-twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @keyframes w-drift { from { transform: translateX(-2px); } to { transform: translateX(2px); } }
  @keyframes w-fall { 0% { transform: translateY(-3px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(8px); opacity: 0; } }
  @keyframes w-snow { 0% { transform: translate(0, -3px); opacity: 0; } 15% { opacity: 1; } 50% { transform: translate(2px, 3px); } 100% { transform: translate(-1px, 10px); opacity: 0; } }
  @keyframes w-flash { 0%, 50%, 100% { opacity: 0.45; } 52% { opacity: 1; } 55% { opacity: 0.5; } 57% { opacity: 1; } 63% { opacity: 0.45; } }
  @keyframes w-mist { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
  @media (prefers-reduced-motion: reduce) {
    .w-svg * { animation: none !important; }
  }
  .w-temp { margin-top: -0.5rem; font: 700 1.5rem/1 var(--display); font-variant-numeric: tabular-nums; }

  .alert { flex: none; margin-top: 0.7rem; background: var(--warn-bg); border: 1px solid var(--line); border-left: 5px solid var(--late); border-radius: 0.8rem; }
  .alert[hidden] { display: none; }
  .alert-btn { width: 100%; display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 0.7rem; background: none; border: 0; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .alert-btn:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; border-radius: 0.6rem; }
  .alert-btn svg { flex: none; width: 1.2rem; height: 1.2rem; min-width: 16px; min-height: 16px; color: var(--late); }
  .alert-tag { flex: none; font-weight: 700; color: var(--late); font-size: max(13px, 0.95rem); }
  .alert-sum { flex: 1; min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: max(13px, 0.95rem); font-weight: 600; }
  .alert-n { flex: none; padding: 0.1rem 0.45rem; border-radius: 999px; background: var(--late); color: var(--bg); font-weight: 700; font-size: max(12px, 0.8rem); }
  .alert-n:empty { display: none; }
  .alert-chev { transition: transform 0.2s; }
  .alert.open .alert-chev { transform: rotate(180deg); }
  .alert-body { padding: 0 0.8rem 0.7rem 2.3rem; max-height: 35vh; overflow: auto; font-size: max(13px, 0.9rem); }
  .alert-item + .alert-item { margin-top: 0.6rem; }
  .alert-item p { margin: 0.15rem 0 0; color: var(--muted); }

  .rain { flex: none; display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem; color: var(--muted); font-size: max(14px, 1rem); }
  .rain[hidden] { display: none; }
  .rain svg { flex: none; width: 1.3rem; height: 1.3rem; min-width: 18px; min-height: 18px; }
  .rain.wet { color: var(--rain); font-weight: 600; }

  .bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-top: 0.5rem; }
  #updated { margin: 0 0.1rem; color: var(--muted); font-size: max(12px, 0.85rem); min-height: 1.3em; }
  .walk { display: inline-flex; align-items: center; gap: 0.15rem; margin: -0.35rem 0; }
  .walk .wi { font-size: max(16px, 1.15rem); margin-right: 0.15rem; }
  .walk button {
    width: 44px; height: 44px; padding: 0; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font-family: var(--text); font-weight: 600; font-size: 1.5rem; line-height: 1;
    display: grid; place-items: center; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .walk button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .walk output { min-width: 3.4rem; text-align: center; font-weight: 600; font-size: max(14px, 1rem); }

  /* Avgangskort: tre kompakte kolonner per retning */
  #dirs { flex: none; display: flex; flex-direction: column; gap: 0.7rem; margin-top: 0.8rem; }
  @media (orientation: landscape) {
    #dirs { flex-direction: row; align-items: flex-start; }
    .dir { flex: 1 1 0; min-width: 0; }
  }
  .dir { flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; padding: 0.8rem 0.9rem 0.9rem; }
  .dir-h { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
  .to {
    flex: 1; min-width: 0; margin: 0; font-weight: 600; font-size: 1.2rem; line-height: 1.15;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere;
  }
  .to .mot { color: var(--muted); font-weight: 500; font-size: max(12px, 0.85rem); margin-right: 0.35rem; }
  .chip { flex: none; padding: 0.3rem 0.7rem; border-radius: 999px; background: var(--ok-bg); color: var(--ok); font-weight: 700; font-size: max(13px, 0.9rem); white-space: nowrap; }
  .chip.now { background: var(--red); color: var(--on-red); }
  .chip.miss { background: var(--bg); color: var(--muted); }
  .cols { display: grid; gap: 0.4rem; align-items: start; }
  .col { min-width: 0; padding: 0.4rem 0.3rem 0.5rem; border-radius: 0.7rem; text-align: center; }
  .col.go { background: var(--go-bg); }
  .col.dim { opacity: 0.4; }
  .col .v { white-space: nowrap; line-height: 1; }
  .col .n { font: 700 2.3rem/1 var(--display); font-variant-numeric: tabular-nums; }
  .col .n.clock { font-size: 1.6rem; }
  .col.go .n { font-size: 3.2rem; }
  .col.go .n.clock { font-size: 2rem; }
  .col.go .n.word { font-size: 3rem; }
  .col .u { font-family: var(--text); font-weight: 600; font-size: max(12px, 0.85rem); color: var(--muted); margin-left: 0.2rem; }
  .col.soon .n { color: var(--red); }
  .col .t { margin-top: 0.25rem; font-size: max(12px, 0.85rem); color: var(--muted); font-variant-numeric: tabular-nums; }
  .col .s { margin-top: 0.1rem; font-size: max(12px, 0.85rem); font-weight: 600; color: var(--muted); }
  .col .s.late { color: var(--late); }
  .col .s.live { color: var(--ok); }
  .col .d { margin-top: 0.1rem; font-size: max(11px, 0.75rem); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .msg {
    flex: none; margin-top: 0.9rem; padding: 0.8rem 1rem; border-radius: 0.8rem;
    background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--red);
    font-size: max(14px, 1rem);
  }
  .msg p { margin: 0 0 0.2rem; }
  .msg p:last-child { margin: 0; color: var(--muted); font-size: max(12px, 0.9rem); }
  /* Nyhetsticker */
  .ticker {
    flex: none; display: flex; align-items: center; gap: 0.7rem;
    margin-top: 0.7rem; padding: 0.5rem 0.8rem 0.5rem 0.55rem;
    background: var(--panel); border: 1px solid var(--line); border-radius: 1rem;
  }
  .ticker[hidden] { display: none; }
  .tk-label {
    flex: none; padding: 0.3rem 0.55rem; border-radius: 0.5rem;
    background: var(--ink); color: var(--bg);
    font-family: var(--display); font-weight: 700; font-size: max(12px, 0.9rem); line-height: 1; letter-spacing: 0.08em;
  }
  .tk-view { position: relative; flex: 1; min-width: 0; overflow: hidden; }
  .tk-view::before, .tk-view::after { content: ""; position: absolute; top: 0; bottom: 0; width: 1.4rem; z-index: 1; pointer-events: none; }
  .tk-view::before { left: 0; background: linear-gradient(90deg, var(--panel), rgba(255, 255, 255, 0)); }
  .tk-view::after { right: 0; background: linear-gradient(270deg, var(--panel), rgba(255, 255, 255, 0)); }
  @media (prefers-color-scheme: dark) {
    .tk-view::before { background: linear-gradient(90deg, var(--panel), rgba(22, 37, 47, 0)); }
    .tk-view::after { background: linear-gradient(270deg, var(--panel), rgba(22, 37, 47, 0)); }
  }
  .tk-track { display: inline-flex; white-space: nowrap; will-change: transform; animation: tk-scroll 120s linear infinite; }
  .ticker:active .tk-track { animation-play-state: paused; }
  @keyframes tk-scroll { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } }
  .tk-set { display: inline-flex; align-items: baseline; }
  .tk-item { font-size: max(14px, 1rem); }
  .tk-item b { font-weight: 600; }
  .tk-in { margin-left: 0.45em; color: var(--muted); }
  .tk-dot { margin: 0 1.1rem; color: var(--red); }

  /* Postlevering */
  .post { flex: none; margin-top: 0.7rem; background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; padding: 0.8rem 0.9rem 0.9rem; }
  .post-h { display: flex; align-items: center; gap: 0.55rem; margin-bottom: 0.35rem; }
  .post-ic { flex: none; font-size: 1.3rem; line-height: 1; }
  .post-h h2 { flex: 1; min-width: 0; margin: 0; font-weight: 600; font-size: 1.05rem; }
  .post-h h2 .pnr { color: var(--muted); font-weight: 500; font-size: max(12px, 0.85rem); margin-left: 0.35rem; }
  .post p { margin: 0 0 0.55rem; font-size: max(13px, 0.95rem); color: var(--ink); }
  .post p b { color: var(--red); }
  .post-note { color: var(--muted); font-size: max(11px, 0.8rem); }
  .post a { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--red); font-weight: 600; font-size: max(13px, 0.9rem); text-decoration: none; }
  .post a:hover, .post a:focus-visible { text-decoration: underline; }

  footer { flex: none; margin: 0.5rem 0.1rem 0; color: var(--muted); font-size: max(11px, 0.75rem); }
</style>
</head>
<body>
<main>
  <header>
    <div class="badge" aria-label="Linje 10">10</div>
    <div>
      <h1>Strandlien</h1>
      <div class="sub">Skyss · Bergen</div>
    </div>
    <div class="weather" id="weather" hidden>
      <div class="w-icon" id="w-icon" aria-hidden="true"></div>
      <span class="w-temp" id="w-temp"></span>
    </div>
  </header>

  <div class="alert" id="alert" hidden>
    <button class="alert-btn" id="alert-btn" type="button" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span class="alert-tag">Avvik</span>
      <span class="alert-sum" id="alert-sum"></span>
      <span class="alert-n" id="alert-n"></span>
      <svg class="alert-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="alert-body" id="alert-body" hidden></div>
  </div>

  <div class="rain" id="rain" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 12a11.05 11.05 0 0 0-22 0zm-5 7a3 3 0 0 1-6 0v-7"/></svg>
    <span id="rain-text"></span>
  </div>

  <div class="bar">
    <div id="updated" role="status" aria-live="polite">Laster avganger…</div>
    <div class="walk" role="group" aria-label="Gangtid til stoppet">
      <span class="wi" aria-hidden="true">🚶</span>
      <button type="button" id="walk-minus" aria-label="Mindre gangtid">−</button>
      <output id="walk-val" aria-live="polite">5 min</output>
      <button type="button" id="walk-plus" aria-label="Mer gangtid">+</button>
    </div>
  </div>
  <div id="dirs"></div>
  <div id="msg"></div>

  <div class="ticker" id="ticker" role="region" aria-label="Nyheter fra NRK" hidden>
    <span class="tk-label">NRK</span>
    <div class="tk-view"><div class="tk-track" id="tk-track"></div></div>
  </div>

  <div class="post" id="post" hidden>
    <div class="post-h">
      <span class="post-ic" aria-hidden="true">✉️</span>
      <h2>Postlevering <span class="pnr">5057</span></h2>
    </div>
    <p id="post-next"></p>
    <p class="post-note">Beregnet ut fra kjent to-ukers syklus. Kan avvike rundt høytider/helligdager.</p>
    <a href="https://www.posten.no/levering-av-post" target="_blank" rel="noopener noreferrer">Sjekk mot Posten →</a>
  </div>

  <footer>Data fra Entur, Meteorologisk institutt og NRK.</footer>
</main>

<script>
(function () {
  "use strict";

  var CLIENT = "personal-strandlien-bus10";
  var GRAPHQL = "https://api.entur.io/journey-planner/v3/graphql";
  var GEOCODER = "https://api.entur.io/geocoder/v1/autocomplete";
  var LINE = "10";
  var STOP_NAME = "Strandlien";
  var SHOW = 3;

  var QUERY =
    "query Departures($id: String!) {" +
    "  stopPlace(id: $id) {" +
    "    id name latitude longitude" +
    "    estimatedCalls(numberOfDepartures: 150, timeRange: 43200) {" +
    "      realtime aimedDepartureTime expectedDepartureTime" +
    "      destinationDisplay { frontText }" +
    "      quay { id publicCode }" +
    "      serviceJourney { line { id publicCode } }" +
    "    }" +
    "  }" +
    "}";

  var timeFmt = new Intl.DateTimeFormat("en-GB", {
    hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "Europe/Oslo"
  });

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  var state = { calls: [], updatedAt: null, error: null, loaded: false, lat: null, lon: null, lineId: null, walk: 5 };
  var weather = { at: 0, busy: false, code: null, hourly: null };
  var busy = false;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function getJSON(url, opts) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 12000);
    opts = opts || {};
    opts.signal = ctl.signal;
    return fetch(url, opts).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).finally(function () { clearTimeout(timer); });
  }

  function fetchCalls(id) {
    return getJSON(GRAPHQL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "ET-Client-Name": CLIENT },
      body: JSON.stringify({ query: QUERY, variables: { id: id } })
    }).then(function (j) {
      if (j.errors && j.errors.length) throw new Error(j.errors[0].message);
      var sp = j.data && j.data.stopPlace;
      if (!sp) return { calls: [], lat: null, lon: null };
      var calls = (sp.estimatedCalls || []).filter(function (c) {
        var l = c.serviceJourney && c.serviceJourney.line;
        return l && l.publicCode === LINE;
      });
      return { calls: calls, lat: sp.latitude, lon: sp.longitude };
    });
  }

  // Finds the Bergen-area stop called Strandlien that line 10 actually serves.
  function findStop() {
    var url = GEOCODER + "?text=" + encodeURIComponent(STOP_NAME) + "&layers=venue&size=15&lang=no";
    return getJSON(url, { headers: { "ET-Client-Name": CLIENT } }).then(function (j) {
      var feats = (j.features || []).filter(function (f) {
        return f.properties && String(f.properties.id).indexOf("NSR:StopPlace:") === 0;
      });
      var exact = feats.filter(function (f) {
        return String(f.properties.name || "").toLowerCase() === STOP_NAME.toLowerCase();
      });
      if (exact.length) feats = exact;
      var local = feats.filter(function (f) {
        return /vestland|hordaland/i.test(String(f.properties.county || ""));
      });
      if (local.length) feats = local;
      if (!feats.length) throw new Error("Fant ikke et stopp som heter " + STOP_NAME + ".");

      var ids = feats.slice(0, 6).map(function (f) { return f.properties.id; });
      var i = 0;
      function next() {
        if (i >= ids.length) return Promise.resolve({ id: null, calls: [], lat: null, lon: null });
        var id = ids[i++];
        return fetchCalls(id).then(function (res) {
          return res.calls.length ? { id: id, calls: res.calls, lat: res.lat, lon: res.lon } : next();
        });
      }
      return next();
    });
  }

  function load() {
    if (busy) return;
    busy = true;
    var id = store.get("stopId");
    var p = id
      ? fetchCalls(id).then(function (res) { return { id: id, calls: res.calls, lat: res.lat, lon: res.lon }; })
      : findStop().then(function (res) { if (res.id) store.set("stopId", res.id); return res; });

    p.then(function (res) {
      state.calls = res.calls;
      if (typeof res.lat === "number" && typeof res.lon === "number") { state.lat = res.lat; state.lon = res.lon; }
      var c0 = res.calls[0];
      var lid = c0 && c0.serviceJourney && c0.serviceJourney.line && c0.serviceJourney.line.id;
      if (lid && /^[\w:.-]+$/.test(lid)) state.lineId = lid;
      loadWeather();
      loadRain();
      loadAlerts();
      state.updatedAt = new Date();
      state.error = null;
      state.loaded = true;
    }).catch(function (err) {
      state.error = err && err.name === "AbortError" ? "Forespørselen tok for lang tid." : (err && err.message) || "Ukjent feil.";
    }).finally(function () {
      busy = false;
      render();
    });
  }


  // Weather from MET Norway (Yr). Uses the stop's own coordinates, Bergen centre as fallback.
  var CLOUD_D = "M18 44h26a9 9 0 0 0 1.5-17.9A13 13 0 0 0 20.6 22.5 11 11 0 0 0 18 44z";
  var MOON_D = "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z";

  function gCloud(tx, ty, k, o) {
    o = o || {};
    return '<g transform="translate(' + tx + ' ' + ty + ') scale(' + k + ')"><g class="w-drift' + (o.rev ? " rev" : "") + '">' +
      '<path class="w-cloud' + (o.dark ? " dark" : "") + '" d="' + CLOUD_D + '"/></g></g>';
  }
  function gSun(cx, cy, r) {
    var rays = "";
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
      rays += '<line x1="' + (cx + c * (r + 4)).toFixed(1) + '" y1="' + (cy + s * (r + 4)).toFixed(1) +
              '" x2="' + (cx + c * (r + 8)).toFixed(1) + '" y2="' + (cy + s * (r + 8)).toFixed(1) + '"/>';
    }
    return '<g class="w-rays" style="transform-origin:' + cx + 'px ' + cy + 'px">' + rays + '</g>' +
           '<circle class="w-sun" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>';
  }
  function gMoon(x, y, k) {
    return '<g transform="translate(' + x + ' ' + y + ') scale(' + k + ')"><path class="w-moon" d="' + MOON_D + '"/></g>';
  }
  function gStars(list) {
    return list.map(function (p) {
      return '<circle class="w-star" cx="' + p[0] + '" cy="' + p[1] + '" r="' + p[2] + '" style="animation-delay:' + p[3] + 's"/>';
    }).join("");
  }
  function gDrops(xs, y0) {
    return xs.map(function (x, i) {
      return '<line class="w-drop" x1="' + x + '" y1="' + y0 + '" x2="' + (x - 2) + '" y2="' + (y0 + 6) + '" style="animation-delay:' + (i * 0.28).toFixed(2) + 's"/>';
    }).join("");
  }
  function gFlakes(xs, y0) {
    return xs.map(function (x, i) {
      return '<circle class="w-flake" cx="' + x + '" cy="' + y0 + '" r="1.9" style="animation-delay:' + (i * 0.55).toFixed(2) + 's"/>';
    }).join("");
  }
  function gFog(cy, x1, x2, delay) {
    return '<line class="w-fog" x1="' + x1 + '" y1="' + cy + '" x2="' + x2 + '" y2="' + cy + '" style="animation-delay:' + delay + 's"/>';
  }

  function weatherSvg(code) {
    var night = /_night$/.test(code);
    var base = code.replace(/_(day|night|polartwilight)$/, "");
    var thunder = base.indexOf("thunder") !== -1;
    var sleet = base.indexOf("sleet") !== -1;
    var snow = base.indexOf("snow") !== -1;
    var rain = base.indexOf("rain") !== -1;
    var showers = base.indexOf("showers") !== -1;
    var heavy = base.indexOf("heavy") === 0;
    var light = base.indexOf("light") === 0;
    var body;

    if (thunder || sleet || snow || rain) {
      var xs = thunder ? [19, 47] : light ? [26, 40] : heavy ? [20, 28, 36, 44] : [22, 32, 42];
      var peek = showers && !thunder;
      var y0 = peek ? 51 : 42;
      var precip;
      if (sleet) {
        precip = gDrops(xs.filter(function (_, i) { return i % 2 === 0; }), y0) +
                 gFlakes(xs.filter(function (_, i) { return i % 2 === 1; }), y0);
      } else if (snow) {
        precip = gFlakes(xs, y0);
      } else {
        precip = gDrops(xs, y0);
      }
      if (thunder) precip += '<polygon class="w-bolt" points="35,34 26,50 33,50 29,62 42,44 35,44 39,34"/>';
      body = peek
        ? (night ? gMoon(3, 1, 1.5) : gSun(22, 22, 8)) + gCloud(14, 12, 0.85) + precip
        : gCloud(0, -5, 1, { dark: true }) + precip;
    } else if (base === "fog") {
      body = gCloud(0, -4, 0.95) + gFog(44, 14, 50, 0) + gFog(50, 20, 56, -1.2) + gFog(56, 12, 44, -2.4);
    } else if (base === "clearsky") {
      body = night
        ? gMoon(9, 11, 1.9) + gStars([[47, 17, 1.6, 0], [53, 29, 1.2, 0.9], [40, 10, 1.1, 1.6]])
        : gSun(32, 32, 11);
    } else if (base === "fair") {
      body = (night ? gMoon(6, 6, 1.6) : gSun(26, 26, 10)) + gCloud(27, 25, 0.55);
    } else if (base === "partlycloudy") {
      body = (night ? gMoon(3, 1, 1.5) : gSun(22, 22, 8)) + gCloud(14, 12, 0.85);
    } else {
      body = gCloud(18, 3, 0.8, { dark: true, rev: true }) + gCloud(-2, 10, 0.95);
    }
    return '<svg class="w-svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false">' + body + '</svg>';
  }

  function loadWeather() {
    if (weather.busy || Date.now() - weather.at < 10 * 60 * 1000) return;
    weather.busy = true;
    var lat = typeof state.lat === "number" ? state.lat : 60.39;
    var lon = typeof state.lon === "number" ? state.lon : 5.32;
    var url = "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=" + lat.toFixed(4) + "&lon=" + lon.toFixed(4);
    getJSON(url).then(function (j) {
      var now = j.properties.timeseries[0].data;
      var t = now.instant.details.air_temperature;
      var next = now.next_1_hours || now.next_6_hours || now.next_12_hours;
      var code = next && next.summary && next.summary.symbol_code;
      if (typeof t !== "number" || !code) throw new Error("no weather");
      var deg = Math.round(t);
      $("w-icon").innerHTML = weatherSvg(code);
      $("w-temp").textContent = deg + "°";
      $("weather").setAttribute("aria-label", "Været nå: " + deg + " grader");
      $("weather").hidden = false;
      weather.at = Date.now();
      weather.code = code;
      weather.hourly = j.properties.timeseries.slice(0, 10).map(function (x) {
        var n1 = x.data && x.data.next_1_hours;
        var amt = n1 && n1.details && n1.details.precipitation_amount;
        return { t: Date.parse(x.time), rate: typeof amt === "number" ? amt : null, code: n1 && n1.summary && n1.summary.symbol_code };
      });
      updateRain();
    }).catch(function () {
      /* keep the last shown weather, or none */
    }).finally(function () { weather.busy = false; });
  }

  // ---- Nyheter fra NRK (overskrift + ingress) ----
  var FEED_URL = "https://www.nrk.no/vestland/toppsaker.rss";  // lokalnyheter fra NRK Vestland
  var FEED_ID = "NRK Vestland";
  var news = { items: [], sig: "", at: 0, busy: false };

  function decodeText(s) {
    var ta = document.createElement("textarea");
    ta.innerHTML = String(s || "").replace(/<\/(p|div|li|h\d)>|<br\s*\/?>/gi, " ").replace(/<[^>]*>/g, "");
    return ta.value.replace(/\s+/g, " ").trim();
  }
  function cleanItems(list) {
    return (Array.isArray(list) ? list : []).filter(function (x) { return x && x.tittel; }).slice(0, 12).map(function (x) {
      return { tittel: String(x.tittel), ingress: String(x.ingress || "") };
    });
  }
  function childText(node, tag) {
    var n = node.getElementsByTagName(tag)[0];
    return n ? n.textContent : "";
  }
  function parseRss(text) {

    for (var i = 0; i < nodes.length && out.length < 12; i++) {
      var t = decodeText(childText(nodes[i], "title"));
      if (t) out.push({ tittel: t, ingress: decodeText(childText(nodes[i], "description")) });
    }
    return out;
  }
  function parseJson(text) {
    var j = JSON.parse(text);
    var age = Date.now() - Date.parse(j && j.hentet);
    if (isFinite(age) && age > 3 * 86400000) throw new Error("Gamle nyheter");
    return { items: cleanItems(j && j.saker), kilde: j && j.kilde };
  }
  function itemsFromRss2json(text) {
    var j = JSON.parse(text);
    if (!j || j.status !== "ok") throw new Error("rss2json feilet");
    return cleanItems((j.items || []).map(function (x) {
      return { tittel: decodeText(x.title), ingress: decodeText(x.description) };
    }));
  }
  function getText(url) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 10000);
    return fetch(url, { signal: ctl.signal }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).finally(function () { clearTimeout(timer); });
  }
  // Prøver kildene i rekkefølge til en gir nyheter fra riktig feed.
  var staleJson = null;
  function jsonSource(url) {
    return function () {
      return getText(url).then(function (t) {
        var r = parseJson(t);
        if (r.kilde === FEED_ID) return r.items;
        if (!staleJson && r.items.length) staleJson = r.items; // annen feed, brukes bare som siste utvei
        throw new Error("Annen feed");
      });
    };
  }
  function newsSources() {
    var list = [];
    var bucket = Math.floor(Date.now() / 300000);
    var m = /^([^.]+)\.github\.io$/.exec(location.hostname);
    var repo = location.pathname.split("/")[1];
    if (m && repo && repo.indexOf(".") === -1) {
      list.push(jsonSource("https://raw.githubusercontent.com/" + m[1] + "/" + repo + "/main/nyheter.json?t=" + bucket));
    }
    list.push(jsonSource("nyheter.json?t=" + bucket));
    list.push(function () { return getText(FEED_URL).then(parseRss); });
    list.push(function () {
      return getText("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(FEED_URL)).then(itemsFromRss2json);
    });
    return list;
  }
  function fetchNews() {
    var list = newsSources(), i = 0;
    staleJson = null;
    function next() {
      if (i >= list.length) {
        return staleJson ? Promise.resolve(staleJson) : Promise.reject(new Error("Ingen nyhetskilde svarte"));
      }
      return list[i++]().then(function (items) {
        if (!items.length) throw new Error("Tom");
        return items;
      }).catch(next);
    }
    return next();
  }

  function tickerItem(it) {
    var item = el("span", "tk-item");
    item.appendChild(el("b", null, it.tittel));
    if (it.ingress) item.appendChild(el("span", "tk-in", it.ingress));
    return item;
  }
  function tickerSet(hidden) {
    var set = el("span", "tk-set");
    if (hidden) set.setAttribute("aria-hidden", "true");
    news.items.forEach(function (it) {
      set.appendChild(tickerItem(it));
      set.appendChild(el("span", "tk-dot", "•"));
    });
    return set;
  }
  function measureTicker() {
    var track = $("tk-track");
    var half = track.getBoundingClientRect().width / 2;
    if (half > 0) track.style.animationDuration = Math.max(30, half / 60) + "s";
  }
  function renderTicker() {
    var box = $("ticker"), track = $("tk-track");
    track.style.animationDuration = "";
    track.replaceChildren();
    if (!news.items.length) { box.hidden = true; return; }
    box.hidden = false;
    track.appendChild(tickerSet(false));
    track.appendChild(tickerSet(true));
    measureTicker();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureTicker);
  }
  function loadNews() {
    if (news.busy || Date.now() - news.at < 8 * 60000) return;
    news.busy = true;
    fetchNews().then(function (items) {
      news.at = Date.now();
      var sig = JSON.stringify(items);
      if (sig !== news.sig) { news.sig = sig; news.items = items; renderTicker(); }
    }).catch(function () {
      news.at = Date.now() - 5 * 60000; // prøv igjen om noen minutter
    }).finally(function () { news.busy = false; });
  }

  // ---- Regnvarsel med tekst (MET nowcast, med timesvarsel som reserve) ----
  var rain = { points: null, at: 0, busy: false };
  var THR = 0.1; // mm/t regnes som nedbør
  var RAIN_WORDS = {
    rain:  { now: "Regner nå", light: "Lett regn nå", heavy: "Kraftig regn nå", noun: "Regn" },
    snow:  { now: "Snør nå", light: "Lett snøfall nå", heavy: "Kraftig snøfall nå", noun: "Snø" },
    sleet: { now: "Sludd nå", light: "Lett sludd nå", heavy: "Kraftig sludd nå", noun: "Sludd" }
  };
  function kindOf(code) {
    code = code || "";
    return code.indexOf("snow") !== -1 ? "snow" : code.indexOf("sleet") !== -1 ? "sleet" : "rain";
  }
  function coords() {
    return { lat: typeof state.lat === "number" ? state.lat : 60.39, lon: typeof state.lon === "number" ? state.lon : 5.32 };
  }
  function loadRain() {
    if (rain.busy || Date.now() - rain.at < 5 * 60000) return;
    rain.busy = true;
    var c = coords();
    var url = "https://api.met.no/weatherapi/nowcast/2.0/complete?lat=" + c.lat.toFixed(4) + "&lon=" + c.lon.toFixed(4);
    getJSON(url).then(function (j) {
      var cov = j.properties && j.properties.meta && j.properties.meta.radar_coverage;
      if (cov && cov !== "ok") throw new Error("Ingen radardekning");
      var pts = (j.properties.timeseries || []).map(function (x) {
        var d = x.data && x.data.instant && x.data.instant.details;
        var n1 = x.data && x.data.next_1_hours;
        return {
          t: Date.parse(x.time),
          rate: d && typeof d.precipitation_rate === "number" ? d.precipitation_rate : null,
          code: n1 && n1.summary && n1.summary.symbol_code
        };
      }).filter(function (p) { return p.rate !== null; });
      if (pts.length < 3) throw new Error("For lite data");
      rain.points = pts;
    }).catch(function () {
      rain.points = null; // bruk timesvarselet i stedet
    }).finally(function () {
      rain.at = Date.now();
      rain.busy = false;
      updateRain();
    });
  }
  function rainSummary() {
    var now = Date.now();
    var noneWord = kindOf(weather.code) === "rain" ? "regn" : "nedbør";
    var list;
    if (rain.points) {
      list = rain.points.filter(function (p) { return p.t >= now - 5 * 60000; });
      if (list.length >= 2) {
        var first = list[0];
        var horizon = Math.max(10, Math.round((list[list.length - 1].t - now) / 60000));
        if (first.rate >= THR) {
          var W = RAIN_WORDS[kindOf(first.code || weather.code)];
          var lead = first.rate >= 2.5 ? W.heavy : first.rate < 0.5 ? W.light : W.now;
          var dry = list.filter(function (p) { return p.rate < THR; })[0];
          return { wet: true, text: dry
            ? lead + " – opphold om " + Math.max(5, Math.round((dry.t - now) / 60000)) + " min"
            : lead + " – ingen opphold de neste " + horizon + " min" };
        }
        var wet = list.filter(function (p) { return p.rate >= THR; })[0];
        if (wet) {
          var mins = Math.max(5, Math.round((wet.t - now) / 60000));
          return { wet: mins <= 30, text: RAIN_WORDS[kindOf(wet.code || weather.code)].noun + " om " + mins + " min" };
        }
        return { wet: false, text: "Ingen " + noneWord + " de neste " + horizon + " min" };
      }
    }
    // Reserve: timesvarsel fra Yr
    list = (weather.hourly || []).filter(function (p) { return p.t + 3600000 > now && typeof p.rate === "number"; }).slice(0, 6);
    if (!list.length) return null;
    if (list[0].rate >= THR) {
      var H = RAIN_WORDS[kindOf(list[0].code || weather.code)];
      var lead2 = list[0].rate >= 2.5 ? H.heavy : list[0].rate < 0.5 ? H.light : H.now;
      var dry2 = list.filter(function (p, i) { return i > 0 && p.rate < THR; })[0];
      return { wet: true, text: lead2 + (dry2 ? " – opphold rundt kl. " + timeFmt.format(new Date(dry2.t)) : "") };
    }
    var wet2 = list.filter(function (p) { return p.rate >= THR; })[0];
    if (wet2) {
      return { wet: wet2.t - now <= 30 * 60000, text: RAIN_WORDS[kindOf(wet2.code || weather.code)].noun + " rundt kl. " + timeFmt.format(new Date(wet2.t)) };
    }
    return { wet: false, text: "Ingen " + noneWord + " de neste " + list.length + " timene" };
  }
  function updateRain() {
    var box = $("rain");
    var r = rainSummary();
    if (!r) { box.hidden = true; return; }
    $("rain-text").textContent = r.text;
    box.classList.toggle("wet", !!r.wet);
    box.hidden = false;
  }

  // ---- Avvik på linja (Entur situasjoner) ----
  var alerts = { items: [], at: 0, busy: false };
  function pickText(list) {
    if (!Array.isArray(list) || !list.length) return "";
    var no = list.filter(function (x) { return x && /^(no|nb|nn)/i.test(x.language || ""); })[0];
    return String((no || list[0]).value || "").replace(/\s+/g, " ").trim();
  }
  function loadAlerts() {
    if (alerts.busy || !state.lineId || Date.now() - alerts.at < 4 * 60000) return;
    alerts.busy = true;
    var q = 'query { line(id: "' + state.lineId + '") { situations { summary { value language } description { value language } validityPeriod { startTime endTime } } } }';
    getJSON(GRAPHQL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "ET-Client-Name": CLIENT },
      body: JSON.stringify({ query: q })
    }).then(function (j) {
      if (!j.data || !j.data.line) throw new Error("Ingen avviksdata");
      var now = Date.now(), seen = {}, out = [];
      (j.data.line.situations || []).forEach(function (sit) {
        var vp = sit.validityPeriod || {};
        var st = vp.startTime ? Date.parse(vp.startTime) : -Infinity;
        var en = vp.endTime ? Date.parse(vp.endTime) : Infinity;
        if (!(st <= now && now <= en)) return;
        var sum = pickText(sit.summary), desc = pickText(sit.description);

    });
  }
  function renderAlert() {
    var box = $("alert");
    if (!alerts.items.length) { box.hidden = true; return; }
    box.hidden = false;
    $("alert-sum").textContent = alerts.items[0].summary;
    $("alert-n").textContent = alerts.items.length > 1 ? "+" + (alerts.items.length - 1) : "";
    var body = $("alert-body");
    body.replaceChildren();
    alerts.items.forEach(function (a) {
      var d = el("div", "alert-item");
      d.appendChild(el("b", null, a.summary));
      if (a.description && a.description !== a.summary) d.appendChild(el("p", null, a.description));
      body.appendChild(d);
    });
  }

  function whenParts(t, now) {
    var mins = Math.floor((t - now) / 60000);
    if (mins < 1) return { num: "Nå", unit: "", clock: false, word: true, soon: true };
    if (mins < 60) return { num: String(mins), unit: "min", clock: false, soon: mins <= 2 };
    return { num: timeFmt.format(new Date(t)), unit: "", clock: true, soon: false };
  }

  function statusShort(c, t) {
    var aimed = Date.parse(c.aimedDepartureTime);
    var diff = Math.round((t - aimed) / 60000);
    if (!c.realtime) return { text: "Rutetid", cls: "" };
    if (diff >= 1) return { text: diff + " min sen", cls: "late" };
    if (diff <= -1) return { text: Math.abs(diff) + " min tidlig", cls: "live" };
    return { text: "I rute", cls: "live" };
  }

  function render() {
    var now = Date.now();
    var walkMs = state.walk * 60000;
    var dirs = $("dirs");
    var msg = $("msg");
    dirs.replaceChildren();
    msg.replaceChildren();

    var groups = {};
    state.calls.forEach(function (c) {
      var t = Date.parse(c.expectedDepartureTime);
      if (isNaN(t) || t < now - 30000) return;
      var key = (c.quay && c.quay.id) || "unknown";
      (groups[key] = groups[key] || []).push({ call: c, t: t });
    });

    var keys = Object.keys(groups).sort();
    keys.forEach(function (key) {
      var list = groups[key].sort(function (a, b) { return a.t - b.t; }).slice(0, SHOW);
      var firstDest = (list[0].call.destinationDisplay && list[0].call.destinationDisplay.frontText) || "Ukjent";

      // Første avgang du rekker, gitt gangtiden
      var goIdx = -1;
      list.forEach(function (d, i) {
        d.ok = d.t - now >= walkMs;
        if (goIdx < 0 && d.ok) goIdx = i;
      });

      var sec = el("section", "dir");
      var head = el("div", "dir-h");
      var title = el("h2", "to");
      title.appendChild(el("span", "mot", "Mot"));
      title.appendChild(document.createTextNode(firstDest));
      head.appendChild(title);
      if (state.walk > 0) {
        if (goIdx < 0) {
          head.appendChild(el("span", "chip miss", "Rekker ikke"));
        } else {
          var leave = Math.floor((list[goIdx].t - now - walkMs) / 60000);
          head.appendChild(leave <= 0 ? el("span", "chip now", "Gå nå") : el("span", "chip", "Gå om " + leave + " min"));
        }
      }
      sec.appendChild(head);

      var cols = el("div", "cols");
      var tracks = [];
      for (var k = 0; k < SHOW; k++) tracks.push(k === goIdx ? "1.35fr" : "1fr");
      cols.style.gridTemplateColumns = tracks.join(" ");

      list.forEach(function (d, i) {
        var w = whenParts(d.t, now);
        var s = statusShort(d.call, d.t);
        var dest = (d.call.destinationDisplay && d.call.destinationDisplay.frontText) || firstDest;
        var dim = state.walk > 0 && !d.ok;
        var col = el("div", "col" + (i === goIdx ? " go" : "") + (dim ? " dim" : "") + (w.soon && !dim ? " soon" : ""));
        var v = el("div", "v");
        v.appendChild(el("span", "n" + (w.clock ? " clock" : "") + (w.word ? " word" : ""), w.num));
        if (w.unit) v.appendChild(el("span", "u", w.unit));
        col.appendChild(v);
        if (!w.clock) col.appendChild(el("div", "t", timeFmt.format(new Date(d.t))));
        col.appendChild(el("div", "s " + s.cls, s.text));
        if (dest !== firstDest) col.appendChild(el("div", "d", dest));
        cols.appendChild(col);
      });
      sec.appendChild(cols);
      dirs.appendChild(sec);
    });

    var upd = $("updated");
    if (state.updatedAt) {
      upd.textContent = "Oppdatert " + timeFmt.format(state.updatedAt);
    } else if (!state.error) {
      upd.textContent = "Laster avganger…";
    } else {
      upd.textContent = "";
    }

    if (state.error) {
      var box = el("div", "msg");
      box.appendChild(el("p", null, "Kunne ikke laste avganger."));
      box.appendChild(el("p", null, state.error + (state.loaded ? " Viser siste oppdatering." : " Sjekk tilkoblingen og last siden på nytt.")));
      msg.appendChild(box);
    } else if (state.loaded && !keys.length) {
      var empty = el("div", "msg");
      empty.appendChild(el("p", null, "Ingen avganger på linje 10 de neste 12 timene."));
      empty.appendChild(el("p", null, "Sjekk at linjen går i dag."));
      msg.appendChild(empty);
    }
  }

  // Postlevering (5057) — beregnet lokalt ut fra kjent to-ukers syklus.
  // Ankeret er en bekreftet leveringsdag hentet fra posten.no sin egen sjekk.
  var POST_ANCHOR = new Date(2026, 8, 23); // onsdag 23. september 2026
  var dayNames = ["søndag", "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag"];
  var monthNames = ["januar", "februar", "mars", "april", "mai", "juni", "juli", "august", "september", "oktober", "november", "desember"];
  function dateOnly(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function sameDate(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function nextDeliveryDates(fromDate, count) {
    var d = new Date(POST_ANCHOR.getFullYear(), POST_ANCHOR.getMonth(), POST_ANCHOR.getDate());
    var isDelivery = true;
    var out = [];
    var guard = 0;
    while (out.length < count && guard < 4000) {
      var dow = d.getDay();
      if (dow !== 0 && dow !== 6) {
        if (isDelivery && d >= fromDate) out.push(new Date(d));
        isDelivery = !isDelivery;
      }
      d.setDate(d.getDate() + 1);
      guard++;
    }
    return out;
  }
  function fmtDay(d, today) {
    var label = dayNames[d.getDay()] + " " + d.getDate() + ". " + monthNames[d.getMonth()];
    if (sameDate(d, today)) return "i dag " + label;
    var tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
    if (sameDate(d, tomorrow)) return "i morgen " + label;
    return label;
  }
  function renderPost() {
    var box = $("post");
    if (!box) return;
    var today = dateOnly(new Date());
    var dates = nextDeliveryDates(today, 1);
    if (!dates.length) { box.hidden = true; return; }
    box.hidden = false;
    $("post-next").replaceChildren(
      document.createTextNode("Neste levering "),
      el("b", null, fmtDay(dates[0], today))
    );
  }
  // Kjør ved oppstart, og planlegg ny kjøring rett over midnatt slik at
  // "i dag"/"i morgen" og datoen alltid stemmer uten at siden må lastes på nytt.
  function scheduleMidnightRefresh() {
    var now = new Date();
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
    setTimeout(function () { renderPost(); scheduleMidnightRefresh(); }, next - now);
  }
  renderPost();
  scheduleMidnightRefresh();

  // Gangtid (0–30 min), huskes på enheten
  var wv = parseInt(store.get("walkMin"), 10);
  state.walk = isFinite(wv) ? Math.max(0, Math.min(30, wv)) : 5;
  function showWalk() { $("walk-val").textContent = state.walk ? state.walk + " min" : "av"; }
  function setWalk(v) {
    state.walk = Math.max(0, Math.min(30, v));
    store.set("walkMin", String(state.walk));
    showWalk();
    render();
  }
  $("walk-minus").addEventListener("click", function () { setWalk(state.walk - 1); });
  $("walk-plus").addEventListener("click", function () { setWalk(state.walk + 1); });
  showWalk();
  $("alert-btn").addEventListener("click", function () {
    var body = $("alert-body");
    var open = body.hidden;
    body.hidden = !open;
    this.setAttribute("aria-expanded", String(open));
    $("alert").classList.toggle("open", open);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { load(); loadNews(); renderPost(); }
  });
  setInterval(function () { if (document.visibilityState === "visible") load(); }, 30000);
  setInterval(render, 10000);
  setInterval(updateRain, 60000);
  setInterval(loadNews, 60000);

  load();
  loadNews();
})();
</script>
</body>
</html>
