name: Hent kalender
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent og tolk kalenderfeeden
        run: |
          python3 - <<'PY'
          import json, re, sys, datetime, urllib.request
          try:
              from zoneinfo import ZoneInfo
          except ImportError:
              ZoneInfo = None

          URL = "https://p191-caldav.icloud.com/published/2/MjcwMzAzNjQ1MjcwMzAzNiYTfYPBi7SejEnvzCnSTkXEa3QD7_9OI7TXjtSMBoOqHkglDQGpaWjKZhZV1ZXHh3CqWYkN_PYYt5oac2oHxao"
          OUT = "kalender.json"
          WINDOW_PAST_DAYS = 1
          WINDOW_FUTURE_DAYS = 21
          MAX_OUT = 20
          MAX_OCCURRENCES_PER_RULE = 400
          UTC = datetime.timezone.utc

          def unfold(text):
              text = text.replace("\r\n", "\n").replace("\r", "\n")
              lines = text.split("\n")
              out = []
              for line in lines:
                  if line[:1] in (" ", "\t") and out:
                      out[-1] += line[1:]
                  else:
                      out.append(line)
              return out

          def parse_props(block_lines):
              props = {}
              for line in block_lines:
                  if ":" not in line:
                      continue
                  head, value = line.split(":", 1)
                  parts = head.split(";")
                  name = parts[0].upper()
                  params = {}
                  for p in parts[1:]:
                      if "=" in p:
                          k, v = p.split("=", 1)
                          params[k.upper()] = v
                  entry = (params, value)
                  if name in props:
                      if isinstance(props[name], list):
                          props[name].append(entry)
                      else:
                          props[name] = [props[name], entry]
                  else:
                      props[name] = entry
              return props

          def get_single(props, name):
              v = props.get(name)
              if v is None:
                  return None
              return v[0] if isinstance(v, list) else v

          def get_list(props, name):
              v = props.get(name)
              if v is None:
                  return []
              return v if isinstance(v, list) else [v]

          def unescape_text(s):
              return (s.replace("\\n", "\n").replace("\\N", "\n")
                       .replace("\\,", ",").replace("\\;", ";").replace("\\\\", "\\"))

          def parse_dt(params, value):
              value = value.strip()
              if params.get("VALUE") == "DATE" or (len(value) == 8 and "T" not in value):
                  d = datetime.datetime.strptime(value, "%Y%m%d").date()
                  return d, True
              if value.endswith("Z"):
                  dt = datetime.datetime.strptime(value, "%Y%m%dT%H%M%SZ").replace(tzinfo=UTC)
                  return dt, False
              dt = datetime.datetime.strptime(value, "%Y%m%dT%H%M%S")
              tzid = params.get("TZID")
              if tzid and ZoneInfo is not None:
                  try:
                      dt = dt.replace(tzinfo=ZoneInfo(tzid))
                  except Exception:
                      dt = dt.replace(tzinfo=ZoneInfo("Europe/Oslo"))
              else:
                  if ZoneInfo is not None:
                      try:
                          dt = dt.replace(tzinfo=ZoneInfo("Europe/Oslo"))
                      except Exception:
                          dt = dt.replace(tzinfo=UTC)
                  else:
                      dt = dt.replace(tzinfo=UTC)
              return dt, False

          def as_aware(dt_or_date):
              if isinstance(dt_or_date, datetime.date) and not isinstance(dt_or_date, datetime.datetime):
                  return datetime.datetime.combine(dt_or_date, datetime.time(0, 0), tzinfo=UTC)
              return dt_or_date

          def parse_rrule(value):
              rule = {}
              for part in value.split(";"):
                  if "=" not in part:
                      continue
                  k, v = part.split("=", 1)
                  rule[k.upper()] = v
              return rule

          WEEKDAY_MAP = {"MO": 0, "TU": 1, "WE": 2, "TH": 3, "FR": 4, "SA": 5, "SU": 6}

          def add_months(d, n):
              y = d.year + (d.month - 1 + n) // 12
              m = (d.month - 1 + n) % 12 + 1
              day = min(d.day, [31, 29 if y % 4 == 0 and (y % 100 != 0 or y % 400 == 0) else 28,
                                 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1])
              return d.replace(year=y, month=m, day=day)

          def expand_rrule(dtstart, rule, exdates, until_cap, all_day):
              freq = rule.get("FREQ")
              if not freq:
                  return
              interval = int(rule.get("INTERVAL", "1") or "1")
              count = int(rule["COUNT"]) if "COUNT" in rule else None
              until = None
              if "UNTIL" in rule:
                  try:
                      until, _ = parse_dt({}, rule["UNTIL"])
                      until = as_aware(until)
                  except Exception:
                      until = None
              byday = [d.strip() for d in rule["BYDAY"].split(",")] if "BYDAY" in rule else None
              produced = 0
              n = 0

              if freq == "DAILY":
                  cur = dtstart
                  while produced < MAX_OCCURRENCES_PER_RULE:
                      cur_aware = as_aware(cur)
                      if (until and cur_aware > until) or cur_aware > until_cap:
                          break
                      if count is not None and n >= count:
                          break
                      if cur_aware.strftime("%Y%m%d") not in exdates:
                          yield cur
                          produced += 1
                      n += 1
                      cur = cur + datetime.timedelta(days=interval)
              elif freq == "WEEKLY":
                  days = [WEEKDAY_MAP[d[-2:]] for d in byday] if byday else [dtstart.weekday()]
                  week_start = dtstart - datetime.timedelta(days=dtstart.weekday())
                  week_idx = 0
                  total_n = 0
                  while produced < MAX_OCCURRENCES_PER_RULE:
                      this_week = week_start + datetime.timedelta(weeks=week_idx * interval)
                      stop = False
                      for wd in sorted(days):
                          occ = this_week + datetime.timedelta(days=wd)
                          if isinstance(dtstart, datetime.datetime):
                              occ = occ.replace(hour=dtstart.hour, minute=dtstart.minute, second=dtstart.second)
                          if occ < dtstart:
                              continue
                          occ_aware = as_aware(occ)
                          if (until and occ_aware > until) or occ_aware > until_cap:
                              stop = True
                              break
                          if count is not None and total_n >= count:
                              stop = True
                              break
                          total_n += 1
                          if occ_aware.strftime("%Y%m%d") not in exdates:
                              yield occ
                              produced += 1
                      if stop:
                          break
                      week_idx += 1
              elif freq in ("MONTHLY", "YEARLY"):
                  cur = dtstart
                  step = interval if freq == "MONTHLY" else interval * 12
                  while produced < MAX_OCCURRENCES_PER_RULE:
                      cur_aware = as_aware(cur)
                      if (until and cur_aware > until) or cur_aware > until_cap:
                          break
                      if count is not None and n >= count:
                          break
                      if cur_aware.strftime("%Y%m%d") not in exdates:
                          yield cur
                          produced += 1
                      n += 1
                      cur = add_months(cur, step)

          def parse_ics(text):
              lines = unfold(text)
              events = []
              block = None
              for line in lines:
                  u = line.strip()
                  if u == "BEGIN:VEVENT":
                      block = []
                  elif u == "END:VEVENT":
                      if block is not None:
                          events.append(parse_props(block))
                      block = None
                  elif block is not None:
                      block.append(line)
              return events

          def build_occurrences(raw_text, now, past_days, future_days):
              events = parse_ics(raw_text)
              window_start = now - datetime.timedelta(days=past_days)
              window_end = now + datetime.timedelta(days=future_days)
              out = []
              for props in events:
                  summary_entry = get_single(props, "SUMMARY")
                  summary = unescape_text(summary_entry[1]) if summary_entry else ""
                  if not summary.strip():
                      continue
                  loc_entry = get_single(props, "LOCATION")
                  location = unescape_text(loc_entry[1]) if loc_entry else ""
                  dtstart_entry = get_single(props, "DTSTART")
                  if not dtstart_entry:
                      continue
                  dtstart, all_day = parse_dt(dtstart_entry[0], dtstart_entry[1])
                  dtend_entry = get_single(props, "DTEND")
                  duration = None
                  if dtend_entry:
                      dtend, _ = parse_dt(dtend_entry[0], dtend_entry[1])
                      try:
                          duration = as_aware(dtend) - as_aware(dtstart)
                      except Exception:
                          duration = None

                  exdates = set()
                  for params, value in get_list(props, "EXDATE"):
                      for v in value.split(","):
                          v = v.strip()
                          if v:
                              try:
                                  exd, _ = parse_dt(params, v)
                                  exdates.add(as_aware(exd).strftime("%Y%m%d"))
                              except Exception:
                                  pass

                  rrule_entry = get_single(props, "RRULE")
                  if rrule_entry:
                      rule = parse_rrule(rrule_entry[1])
                      occ_starts = list(expand_rrule(dtstart, rule, exdates, window_end, all_day))
                  else:
                      occ_starts = []
                      if dtstart.strftime("%Y%m%d") not in exdates:
                          occ_starts = [dtstart]

                  for occ in occ_starts:
                      occ_aware = as_aware(occ)
                      occ_end_aware = occ_aware + duration if duration is not None else occ_aware
                      if occ_end_aware < window_start or occ_aware > window_end:
                          continue
                      out.append({
                          "tittel": summary.strip(),
                          "start": occ_aware.astimezone(UTC).isoformat().replace("+00:00", "Z"),
                          "slutt": (occ_end_aware.astimezone(UTC).isoformat().replace("+00:00", "Z")) if duration is not None else None,
                          "heldag": bool(all_day),
                          "sted": location.strip(),
                      })
              out.sort(key=lambda x: x["start"])
              seen = set()
              deduped = []
              for e in out:
                  key = (e["tittel"], e["start"])
                  if key in seen:
                      continue
                  seen.add(key)
                  deduped.append(e)
              return deduped[:MAX_OUT]

          now = datetime.datetime.now(UTC)
          req = urllib.request.Request(URL, headers={"User-Agent": "Mozilla/5.0 (compatible; strandlien-bus/1.0)"})
          raw = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          hendelser = build_occurrences(raw, now, WINDOW_PAST_DAYS, WINDOW_FUTURE_DAYS)
          if not hendelser:
              raise SystemExit("Fant ingen hendelser i kalenderen")
          try:
              gammel = json.load(open(OUT, encoding="utf-8")).get("hendelser")
          except Exception:
              gammel = None
          if gammel != hendelser:
              ut = {"hentet": now.isoformat(), "hendelser": hendelser}
              json.dump(ut, open(OUT, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
      - name: Lagre hvis noe er endret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kalender.json
          git diff --cached --quiet || (git commit -m "Oppdater kalender" && git push)
